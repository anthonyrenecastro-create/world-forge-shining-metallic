[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrm-ecology"
version = "0.1.0"
description = "HRM Ecology: A Resilient World-Model Runtime"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hrm_ecology*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
